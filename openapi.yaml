openapi: 3.0.3

info:
  title: CampusLab Report Internal API
  version: 1.0.0
  description: >-
    API interna de reportería. Report consulta Bookings y Catalog por HTTP y no
    implementa autenticación propia. Las rutas públicas y roles se aplican en
    ms-campuslab-bff.

servers:
  - url: http://localhost:8084

tags:
  - name: Report

paths:
  /api/v1/report/kpis:
    get:
      tags:
        - Report
      summary: Obtener KPIs
      operationId: getKpis
      parameters:
        - name: range
          in: query
          required: false
          description: >-
            last24h, last7d o last30d. Un valor no reconocido usa last24h.
            La ventana se calcula en America/Santiago.
          schema:
            type: string
            default: last24h
      responses:
        '200':
          description: KPIs obtenidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiResponse'

  /api/v1/report/events/summary:
    get:
      tags:
        - Report
      summary: Resumen de eventos recibidos desde audit.timeline
      operationId: getEventSummary
      description: >-
        Conteo en memoria de los eventos consumidos con el grupo campuslab-report.
        Se reinicia al reiniciar el servicio.
      responses:
        '200':
          description: Resumen de eventos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSummaryResponse'

  /api/v1/report/top-resources:
    get:
      tags:
        - Report
      summary: Obtener recursos más utilizados
      operationId: getTopResources
      parameters:
        - name: range
          in: query
          required: false
          description: >-
            last24h, last7d o last30d. Un valor no reconocido usa last24h.
            La ventana se calcula en America/Santiago.
          schema:
            type: string
            default: last7d
      responses:
        '200':
          description: Recursos más utilizados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopResourceResponse'

components:
  schemas:
    KpiResponse:
      type: object
      properties:
        totalBookings:
          type: integer
        bookingsPerHour:
          type: number
          format: double
        averageCycleTimeMinutes:
          type: number
          format: double
        occupiedResources:
          type: integer

    EventSummaryResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        byType:
          type: object
          additionalProperties:
            type: integer
            format: int64
        lastEventAt:
          type: string
          format: date-time
          nullable: true

    TopResourceResponse:
      type: object
      properties:
        resourceId:
          type: integer
          format: int64
        resourceName:
          type: string
        totalBookings:
          type: integer
