spring.application.name=ms-campuslab-report

server.port=${SERVER_PORT:8084}

services.bookings.url=${BOOKINGS_SERVICE_URL:http://localhost:8081}
services.catalog.url=${CATALOG_SERVICE_URL:http://localhost:8082}

management.endpoints.web.exposure.include=health

# Kafka: consumidor de audit.timeline (aditivo; los KPIs siguen calculandose desde bookings)
campuslab.kafka.topics.audit=audit.timeline
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
spring.kafka.consumer.group-id=campuslab-report
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.key.delegate.class]=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=cl.campuslab.report.messaging.AuditEvent
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
spring.kafka.consumer.properties[spring.json.trusted.packages]=cl.campuslab.report.messaging
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
# Interruptor: REPORT_KAFKA_ENABLED=false desactiva el consumidor sin afectar el resto del servicio
spring.kafka.listener.auto-startup=${REPORT_KAFKA_ENABLED:true}
